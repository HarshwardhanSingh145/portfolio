    <!-- Signature Window Gate Transition Curtain -->
    <div id="window-gate-curtain" class="window-gate-curtain is-open">
      <div class="window-gate-shutter window-gate-upper"></div>
      <div class="window-gate-shutter window-gate-lower"></div>
      <div class="window-gate-brand">

    <style>
      .window-gate-curtain {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999999;
        pointer-events: none;
        overflow: hidden;
        display: block;
      }
      .window-gate-shutter {
        position: fixed;
        width: max(180vw, 180vh);
        height: max(180vw, 180vh);
        left: calc(50vw - max(90vw, 90vh));
        background-color: #0b0b0b;
        will-change: transform;
        pointer-events: auto;
      }
      .window-gate-upper {
        bottom: calc(50% - 2px);
        transform: translate3d(0, 0, 0) skewY(-45deg);
        transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .window-gate-lower {
        top: 50%;
        transform: translate3d(0, 0, 0) skewY(-45deg);
        transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .window-gate-brand {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 100000000;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.35s ease, transform 0.85s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .window-gate-logo {
        height: 52px;
        width: auto;
        filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5));
      }

      /* OPEN STATE: Gates slide diagonally apart like window shutters */
      .window-gate-curtain.is-open .window-gate-upper {
        transform: translate3d(0, calc(-1 * max(200vw, 200vh)), 0) skewY(-45deg);
      }
      .window-gate-curtain.is-open .window-gate-lower {
        transform: translate3d(0, max(200vw, 200vh), 0) skewY(-45deg);
      }
      .window-gate-curtain.is-open .window-gate-brand {
        opacity: 0;
        transform: translate(-50%, -120%) scale(0.95);
      }
      .window-gate-curtain.is-open {
        pointer-events: none;
      }
    </style>

    <script>
      var navigated = false;

      window.triggerForward = function(href) {
        if (navigated) return;
        navigated = true;
        href = href || '/design';
        sessionStorage.setItem('gate_transfer', '1');

        var gate = document.getElementById('window-gate-curtain');
        if (gate) {
          gate.style.display = 'block';
          gate.style.pointerEvents = 'auto';
          // Force layout reflow so the closing animation fires reliably
          void gate.offsetHeight;
          gate.classList.remove('is-open');

          setTimeout(function () {
            window.location.href = href;
          }, 850);
        } else {
          window.location.href = href;
        }
      };
      var triggerForward = window.triggerForward;

      // Initialize gate behavior on page load
      function initGateHero() {
        var gate = document.getElementById('window-gate-curtain');
        var isTransfer = sessionStorage.getItem('gate_transfer') === '1' || document.referrer.indexOf('/design') !== -1;

        if (isTransfer) {
          sessionStorage.removeItem('gate_transfer');
          // Hide Webflow preloader to prevent double waiting
          var wfPreloader = document.querySelector('.preloader');
          if (wfPreloader) {
            wfPreloader.style.display = 'none';
          }
          if (gate) {
            gate.style.display = 'block';
            gate.style.pointerEvents = 'auto';
            gate.classList.remove('is-open');
            setTimeout(function () {
              gate.classList.add('is-open');
              setTimeout(function () {
                gate.style.pointerEvents = 'none';
              }, 950);
            }, 80);
          }
        } else {
          // Cold visit: Webflow entrance preloader handles initial gate opening
          if (gate) {
            gate.classList.add('is-open');
            gate.style.pointerEvents = 'none';
          }
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initGateHero);
      } else {
        initGateHero();
      }

      // Handle browser back/forward buttons
      window.addEventListener('pageshow', function (event) {
        navigated = false;
        var gate = document.getElementById('window-gate-curtain');
        if (gate) {
          gate.classList.add('is-open');
          gate.style.pointerEvents = 'none';
        }
      });

      $(function () {
        $(
          ".photos__single--link, .intro__link-web, .intro__link-photo, .intro__link, .nav__item, .inner--link, .inner-link, .nav__item--wrapper, .is-transition, a[href='/design'], a[href='/contact']"
        ).click(function (e) {
          e.preventDefault();
          var goTo = this.getAttribute('href') || '/design';
          if (!goTo || goTo === '#' || goTo.startsWith('#')) {
            goTo = '/design';
          }
          triggerForward(goTo);
        });
      });

      // Mouse wheel downwards transitions forward to design
      window.addEventListener('wheel', function (e) {
        if (e.deltaY > 40) {
          triggerForward('/design');
        }
      }, { passive: true });

      // Mobile touch swipe up transitions forward to design
      var touchY = 0;
      window.addEventListener('touchstart', function (e) {
        touchY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchend', function (e) {
        var diff = touchY - e.changedTouches[0].clientY;
        if (diff > 60) {
          triggerForward('/design');
        }
      }, { passive: true });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".intro__link-photo").forEach((trigger) => {
          trigger.addEventListener("mouseover", function () {
            document
              .querySelectorAll(".intro__link-web")
              .forEach((target) => target.classList.add("is--outline-text"));
          });
        });

        document.querySelectorAll(".intro__link-photo").forEach((trigger) => {
          trigger.addEventListener("mouseout", function () {
            document
              .querySelectorAll(".intro__link-web")
              .forEach((target) => target.classList.remove("is--outline-text"));
          });
        });

        // Mobile tap/touch on portrait to reveal animation
        const introPhoto = document.querySelector(".intro__photo");
        const linkPhoto = document.querySelector(".intro__link-photo");
        const linkWeb = document.querySelector(".intro__link-web");
        let isMobileRevealed = false;

        if (introPhoto) {
          introPhoto.addEventListener("click", function (e) {
            if (window.innerWidth <= 767) {
              e.preventDefault();
              e.stopPropagation();
              isMobileRevealed = !isMobileRevealed;
              if (linkPhoto) {
                const eventType = isMobileRevealed ? "mouseenter" : "mouseleave";
                linkPhoto.dispatchEvent(new MouseEvent(eventType, { bubbles: true, cancelable: true }));
                linkPhoto.dispatchEvent(new MouseEvent(isMobileRevealed ? "mouseover" : "mouseout", { bubbles: true, cancelable: true }));
              }
              if (linkWeb) {
                if (isMobileRevealed) {
                  linkWeb.classList.add("is--outline-text");
                } else {
                  linkWeb.classList.remove("is--outline-text");
                }
              }
            }
          });
        }
      });
    </script>
